services:
  - type: web
    name: annocollector-be
    runtime: docker
    plan: free
    dockerContext: ./be
    dockerfilePath: ./be/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false # ["https://<fe>.onrender.com"]
      - key: FRONTEND_URL
        sync: false # https://<fe>.onrender.com
      - key: API_PUBLIC_URL
        sync: false # https://<be>.onrender.com
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUPABASE_HOST
        sync: false
      - key: SUPABASE_PORT
        value: "6543"
      - key: SUPABASE_MIGRATION_PORT
        value: "5432"
      - key: SUPABASE_USER
        sync: false
      - key: SUPABASE_PASSWORD
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false

  - type: web
    name: annocollector-fe
    runtime: docker
    plan: free
    dockerContext: ./fe
    dockerfilePath: ./fe/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # https://<be>.onrender.com/api/v1 (baked at build time)
